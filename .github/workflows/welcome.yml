name: Post welcome comment
on:
  pull_request:
    types: [opened]
permissions:
  pull-requests: write
  statuses: write
jobs:
  welcome:
    name: Post welcome comment
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR_URL" --body "Welcome to the repository!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
  status-check:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: welcome
    if: always()
    steps:
      - name: Check workflow result
        run: |
          if [ "${{ needs.welcome.result }}" != "success" ]; then
            echo "Workflow failed- blocking merge."
            exit 1
          fi
          echo "Workflow passed- merge is allowed."
